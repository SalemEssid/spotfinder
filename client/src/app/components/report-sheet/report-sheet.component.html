<!-- The keyboard equivalent of the backdrop click is the Esc key (handled natively by <dialog>). -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog #dialog class="sheet" aria-labelledby="report-title" aria-describedby="report-help" (close)="closed.emit()" (click)="onDialogClick($event)">
  <form class="sheet__content" (submit)="submit($event)">
    <span class="sheet__handle" aria-hidden="true"></span>
    <h2 id="report-title">Il y a du monde ici ?</h2>
    <p id="report-help" class="sheet__help">
      Votre réponse met à jour la jauge pour tout le monde.
      @if (spotName()) {
        <span class="visually-hidden">Lieu : {{ spotName() }}.</span>
      }
    </p>

    <fieldset class="choices">
      <legend class="visually-hidden">Niveau d’affluence</legend>
      @for (option of choices; track option.value) {
        <label class="choice" [class.is-selected]="choice() === option.value">
          <input
            type="radio"
            name="crowd-level"
            [value]="option.value"
            [checked]="choice() === option.value"
            (change)="choice.set(option.value)"
          />
          <span [class]="'choice__dot choice__dot--' + option.value" aria-hidden="true"></span>
          {{ option.label }}
        </label>
      }
    </fieldset>
    <p class="sheet__hint" aria-live="polite">{{ selectedHint() }}</p>

    <button type="submit" class="btn btn--primary btn--block" [disabled]="choice() === null">Envoyer</button>
    <button type="button" class="btn btn--ghost btn--block" (click)="close()">Annuler</button>
  </form>
</dialog>
